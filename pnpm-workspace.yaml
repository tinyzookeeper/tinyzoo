packages:
  - packages/*
  - packages/cms/starter
  - site
  - playground

# One copy of the editor stack: collaborative editing breaks when two ProseMirror
# or TipTap core versions meet (Nuxt UI brings its own editor packages).
overrides:
  '@tiptap/core': 3.34.0
  '@tiptap/pm': 3.34.0
  prosemirror-model: ^1.25.13
  prosemirror-state: ^1.4.4
  prosemirror-view: ^1.41.0
  # The website's sharing images (nuxt-og-image) read the brand fonts only through
  # @nuxt/fonts >= 1.0, while @nuxt/ui still asks for ^0.14: without this they fall
  # back to Inter.
  '@nuxt/fonts': 1.2.0
