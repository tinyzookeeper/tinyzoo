name: my-cms

# Local development dependencies for the playground.
#
#   docker compose up -d                 # Postgres only (all you need for `pnpm play`)
#   docker compose --profile s3 up -d    # + MinIO, to exercise the S3/R2 storage driver
#   docker compose --profile mail up -d  # + Mailpit: catches invite/reset emails (UI on :8025)
#   docker compose --profile redis up -d # + Valkey (Redis): shared rate limits / realtime across instances
#   docker compose down                  # stop (data survives — it lives in named volumes)
#   docker compose down -v               # stop *and* wipe the data
#
# Host ports are overridable so they can dodge whatever else you have running:
#   CMS_PG_PORT=5455 docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      # 5434 matches DATABASE_URL in playground/.env
      - "${CMS_PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- S3-compatible storage (opt-in) -------------------------------------
  # Only started with `--profile s3`. Exercises the S3Driver end-to-end
  # without an AWS/Cloudflare account.
  minio:
    # MinIO no longer publishes images on Docker Hub; this frozen build is MinIO with the
    # same API and credentials, and it creates the bucket itself (public read, as below).
    image: bitnamilegacy/minio:2025.7.23
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # <bucket>:<policy> — `download` = anyone may read (the driver's 'public' delivery).
      # For a private bucket (Pushbase-like, delivery 'proxy'), use `cms-media:none`.
      MINIO_DEFAULT_BUCKETS: cms-media:download
    ports:
      # 9100/9101, not the usual 9000/9001 — those often collide with
      # kubectl port-forwards and other local tooling.
      - "${CMS_MINIO_PORT:-9100}:9000"
      - "${CMS_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  # --- Email catcher (opt-in) ---------------------------------------------
  # Invitations and password resets go here instead of real inboxes. Point the
  # playground at it with NUXT_CMS_MAIL_TRANSPORT=smtp, NUXT_CMS_MAIL_SMTP_HOST=localhost,
  # NUXT_CMS_MAIL_SMTP_PORT=1025 and open http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "${CMS_SMTP_PORT:-1025}:1025"
      - "${CMS_MAILPIT_UI_PORT:-8025}:8025"


  # --- Redis-compatible store (opt-in) -----------------------------------
  # Set NUXT_CMS_REDIS_URL=redis://localhost:6383 to share rate limits and realtime
  # messages between instances (as with Pushbase's managed Redis).
  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "${CMS_REDIS_PORT:-6383}:6379"

volumes:
  pgdata:
  miniodata:
