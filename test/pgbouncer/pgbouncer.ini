;; PgBouncer in front of the test Postgres, for the multi-tenant suite (see README.md).
;; Transaction mode, one pool per (site database, site user), no list of the sites' users.

[databases]
;; Every database name is passed on as it is: a new site needs no change here.
* = host=tz-mt-pg port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; A server connection belongs to a client only for one transaction.
pool_mode = transaction

;; The sites' users are not listed anywhere. A user that is not in auth_file is looked up in
;; Postgres with auth_query, run as auth_user in ONE database (auth_dbname), which holds the
;; lookup function (auth.sql). The answer is the user's SCRAM secret as Postgres stores it:
;; PgBouncer checks the client against it and, with what the client proved, signs in to
;; Postgres as that same user (SCRAM pass-through). No password of a site is kept here.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = t5_pgbouncer
auth_dbname = t5_pgbouncer_auth
auth_query = SELECT uname, phash FROM public.pgbouncer_user_lookup($1)

;; Real connections per (database, user): a site has one database and one user, so this is
;; "per site". Its clients beyond that wait for a connection (query_wait_timeout).
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 0
;; A real connection nobody used for this long is closed: only sites in use hold any.
server_idle_timeout = 5
;; How long a client waits for a real connection before it gets an error.
query_wait_timeout = 15

;; Connections from the apps are cheap: allow many.
max_client_conn = 5000

;; SHOW POOLS / SHOW SERVERS / SHOW STATS on the `pgbouncer` database, for the measurements.
admin_users = t5_pgbouncer
stats_users = t5_pgbouncer

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
