name: Heavy checks

# The slow checks that ci.yml leaves out of every pull request. They run
#   - all of them on every push to main (a newer push cancels the run it supersedes), except
#     the merge of the "Version packages" pull request, whose code was checked as it was made,
#   - nightly, on main (schedule), and on demand: Actions → Heavy checks → Run workflow, on any
#     branch (workflow_dispatch), all of them,
#   - on an ordinary pull request, only the ones whose paths it changes (the `changes` job),
#   - on the "Version packages" pull request (head branch changeset-release/main), none: its
#     code is the main commit it was made from, and the `main` job requires that this workflow
#     and ci.yml passed there (waiting for them when they still run). So a release is checked
#     before anyone asks for it, and merging the version pull request waits on nothing new.
#
#   upgrade    a site made on an older tinyzoo moves to this one (scripts/upgrade-check.mjs),
#              one job per baseline
#   consumer   the packages as a client app gets them: packed, installed, built
#   starter    the starter in four combinations made by the packed `tinyzoo init` and
#              `create-tinyzoo`, installed from the tarballs, migrated, built, started, checked
#              (scripts/starter-check.mjs), one job per combination
#   locale-switch  turning publish.perLocale on keeps the website as it was: a second playground
#              build, compared with the first (test/api/locale-publishing-switch.spec.ts)
#   backup     tinyzoo backup / restore with pg_dump, pg_restore and psql of 16, 17 and 18
#              against a 16 server — strict: a runner without the tools fails
#   s3-minio   the S3 delivery modes against a real MinIO
#   site-image the website's Docker image (site/Dockerfile) builds from the repo, as the deploy does
#   main       the version pull request only: ci.yml and this workflow passed on its main commit
#   result     one check that is green when every heavy job that ran passed (skipped = nothing relevant)
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:

# A pull request's newer push cancels its older run, and so does a newer push to main: the
# version pull request asks only about the main commit it was made from, which is the newest.
concurrency:
  group: heavy-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Which heavy jobs this event needs. A push to main (but the version pull request's merge), the
  # nightly run and a manual one need all of them; an ordinary pull request needs the ones whose
  # paths it touches (or the workflow itself); the version pull request none (the `main` job).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the pull request's files through the API
    outputs:
      backup: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.backup == 'true' || steps.filter.outputs.workflow == 'true' }}
      upgrade: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.upgrade == 'true' || steps.filter.outputs.workflow == 'true' }}
      consumer: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.consumer == 'true' || steps.filter.outputs.workflow == 'true' }}
      starter: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.starter == 'true' || steps.filter.outputs.workflow == 'true' }}
      minio: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.minio == 'true' || steps.filter.outputs.workflow == 'true' }}
      site-image: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.site-image == 'true' || steps.filter.outputs.workflow == 'true' }}
      locale-switch: ${{ steps.everything.outputs.all == 'true' || steps.filter.outputs.locale-switch == 'true' || steps.filter.outputs.workflow == 'true' }}
      # The matrices of `upgrade` and `starter`, as JSON arrays: always set, used or not.
      baselines: ${{ steps.lists.outputs.baselines }}
      starter-combinations: ${{ steps.lists.outputs.starter }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
      # The upgrade baselines (.github/upgrade-baseline, plus latest-tag) and the starter's
      # combinations, read from the modules the two scripts read them from (no install needed).
      - id: lists
        run: |
          echo "baselines=$(node -e "import('./scripts/upgrade-check/baselines.mjs').then((m) => console.log(JSON.stringify(m.listedBaselines('.'))))")" >> "$GITHUB_OUTPUT"
          echo "starter=$(node -e "import('./scripts/starter-check/scenarios.mjs').then((m) => console.log(JSON.stringify(m.SCENARIOS.map((s) => s.id))))")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - id: everything
        if: >-
          github.event_name != 'pull_request' &&
          !(github.event_name == 'push' && contains(github.event.head_commit.message, '/changeset-release/main'))
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      # paths-filter v4.0.3, pinned to its commit.
      - id: filter
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            workflow:
              - '.github/workflows/heavy.yml'
              - '.github/actions/playground-build-cache/**'
            backup:
              - 'packages/cms/cli/backup*'
              - 'packages/cms/cli/tar*'
              - 'packages/cms/src/migrate*'
              - '.github/actions/pg-client/**'
              - 'test/api/backup.spec.ts'
            upgrade:
              - 'packages/cms/src/**'
              - 'packages/cms/cli/**'
              - 'packages/cms/server/**'
              - 'packages/cms/starter/**'
              - 'scripts/upgrade-check*'
              - 'scripts/upgrade-check/**'
              - '.github/upgrade-baseline/**'
            consumer:
              - 'packages/*/package.json'
              - 'packages/cms/module.ts'
              - 'packages/cms/nuxt.config.ts'
              - 'packages/cms/cli/init.mjs'
              - 'packages/cms/starter/**'
              - 'packages/create-tinyzoo/**'
              - 'scripts/consumer-check*'
              - 'test/consumer/**'
              - 'playground/package.json'
              - 'playground/cms.config.ts'
              - 'playground/cms-plugins/**'
            starter:
              - 'packages/cms/starter/**'
              - 'packages/cms/cli/init*'
              - 'packages/create-tinyzoo/**'
              - 'scripts/starter-check*'
            minio:
              - 'packages/cms/server/utils/cmsStorage*'
              - 'packages/cms/server/api/cms/_media/**'
              - 'packages/cms/cli/transfer*'
              - 'test/api/s3-minio.spec.ts'
            site-image:
              - 'site/**'
              - 'docs/**'
              - 'packages/cms/**'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'test/contracts/openapi.playground.json'
            locale-switch:
              - 'packages/cms/**'
              - 'playground/**'
              - 'pnpm-lock.yaml'
              - 'test/api/locale-publishing-switch.spec.ts'
              - 'test/setup/**'
              - 'test/helpers/**'

  # A site made on an older tinyzoo moves to this one: scripts/upgrade-check.mjs builds each
  # baseline in .github/upgrade-baseline (and the latest release tag), seeds a site from it,
  # installs this commit's packages, runs `tinyzoo upgrade`, starts the site on the same
  # database and compares what the content API and the admin return, field by field.
  # CONTRIBUTING.md says what to do when it fails. One job per baseline, at the same time.
  upgrade:
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    name: upgrade (from ${{ matrix.baseline }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.changes.outputs.baselines) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    env:
      # The check makes (and drops) its own cms_upcheck_* databases on this server.
      UPGRADE_CHECK_DATABASE_URL: postgres://cms:cms@localhost:5432/postgres
      UPGRADE_CHECK_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baselines are commits and tags
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # the store also holds what the baseline and the site installs download
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:upgrade --from "$BASELINE" --logs "$RUNNER_TEMP/upgrade-logs"
        env:
          BASELINE: ${{ matrix.baseline }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-check-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/upgrade-logs
          if-no-files-found: ignore

  # The packages as a client app gets them: packed, installed from the tarballs into
  # a fresh app outside the workspace, CLI run from the install, production build.
  consumer:
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:consumer

  # The starter as a new site gets it, in four combinations of languages, parts and demo content
  # (scripts/starter-check.mjs): each site is made by the packed package, installed from the
  # tarballs, migrated, type-checked, built, started and checked. About ten minutes on a laptop;
  # it needs a Postgres server and makes (and drops) its own databases on it. One job per
  # combination (scripts/starter-check/scenarios.mjs), at the same time.
  starter:
    needs: changes
    if: needs.changes.outputs.starter == 'true'
    name: starter (${{ matrix.combination }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.changes.outputs.starter-combinations) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      STARTER_CHECK_DATABASE_URL: postgres://cms:cms@localhost:5432/cms_test_starter
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # the store also holds what the four sites' installs download
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:starter --only "$COMBINATION"
        env:
          COMBINATION: ${{ matrix.combination }}

  # `tinyzoo restore` with client tools of each major version against the 16 server: the same
  # version (what the compose file runs), and newer, which writes settings 16 does not know
  # (`SET transaction_timeout`, pg_dump 17+). Only the backup spec: ci.yml runs the rest.
  backup:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client: [16, 17, 18]
    name: backup (client tools ${{ matrix.client }}, server 16)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://cms:cms@localhost:5432/cms_test
      # The spec skips where the tools are missing; here a missing tool must fail it.
      TINYZOO_REQUIRE_PG_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pg-client
        with:
          version: ${{ matrix.client }}
          database-url: postgres://cms:cms@localhost:5432/cms
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playground-build-cache
        id: build-cache
      - run: pnpm exec vitest run --project api test/api/backup.spec.ts
        env:
          CMS_TEST_REUSE_BUILD: ${{ steps.build-cache.outputs.reuse }}

  # The S3 delivery modes (proxy, redirect) against a real MinIO, with no bucket policy
  # (private): what the in-process fake S3 cannot show.
  s3-minio:
    needs: changes
    if: needs.changes.outputs.minio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://cms:cms@localhost:5432/cms_test
      TEST_S3_ENDPOINT: http://localhost:9190
      TEST_S3_ACCESS_KEY: minio
      TEST_S3_SECRET_KEY: minio12345
    steps:
      - uses: actions/checkout@v4
      # MinIO no longer publishes images on Docker Hub; bitnamilegacy/minio is a frozen build of it.
      - run: |
          docker run -d --name minio -p 9190:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 \
            bitnamilegacy/minio:2025.7.23
          for _ in $(seq 1 30); do curl -sf http://localhost:9190/minio/health/ready && exit 0; sleep 1; done
          echo "MinIO did not come up" >&2
          docker logs minio >&2
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playground-build-cache
        id: build-cache
      - run: pnpm exec vitest run --project api test/api/s3-minio.spec.ts
        env:
          CMS_TEST_REUSE_BUILD: ${{ steps.build-cache.outputs.reuse }}

  # Turning publish.perLocale on keeps the website as it was: the spec builds the playground a
  # second time with the option off and compares what both servers answer on one database. The
  # second build is why it is here and not in ci.yml's API parts.
  locale-switch:
    needs: changes
    if: needs.changes.outputs.locale-switch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://cms:cms@localhost:5432/cms_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playground-build-cache
        id: build-cache
      - run: pnpm exec vitest run --project api test/api/locale-publishing-switch.spec.ts
        env:
          CMS_TEST_REUSE_BUILD: ${{ steps.build-cache.outputs.reuse }}

  # The website's image, built the way scripts/deploy-site.mjs has Pushbase build it: from the
  # repo root with site/Dockerfile, through .dockerignore. CI builds the site outside Docker, so
  # a file the build needs but .dockerignore leaves out (0.6's deploy: test/contracts/…) fails here.
  site-image:
    needs: changes
    if: needs.changes.outputs.site-image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build site/Dockerfile
        run: docker build --file site/Dockerfile --tag tinyzoo-site:ci .
      - name: The image holds the server and the seed
        run: docker run --rm --entrypoint sh tinyzoo-site:ci -c 'test -f .output/server/index.mjs && test -f scripts/seed.mjs && ls seed >/dev/null'

  # The version pull request: its code is the main commit it was made from (its head's parent),
  # plus versions and changelogs. That commit's push ran ci.yml and this workflow in full; they
  # must have passed. Still running: wait for them (they started when that commit was pushed).
  main:
    if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: ci.yml and heavy.yml passed on the main commit of this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.parents[0].sha')
          echo "This version pull request was made from main at $sha."
          deadline=$(( $(date +%s) + 1800 ))
          for wf in ci.yml heavy.yml; do
            while :; do
              run=$(gh run list -R "$REPO" --workflow "$wf" --branch main --commit "$sha" --limit 20 \
                --json status,conclusion,event,url --jq '[.[] | select(.event != "pull_request")][0] // empty')
              if [ -z "$run" ]; then
                echo "::error::No $wf run on main at $sha. Start one (Actions → Run workflow on main, or push to main) and re-run this check."
                exit 1
              fi
              status=$(jq -r .status <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run"); url=$(jq -r .url <<<"$run")
              if [ "$status" = completed ]; then
                echo "$wf on $sha: $conclusion ($url)"
                if [ "$conclusion" != success ]; then
                  echo "::error::$wf did not pass on main at $sha ($conclusion): $url. Cancelled means a newer push to main superseded it; that push updates this pull request."
                  exit 1
                fi
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$wf on main at $sha is still $status after 30 minutes: $url"
                exit 1
              fi
              echo "$wf on $sha: $status, waiting…"
              sleep 20
            done
          done

  # One check for "the heavy jobs this event needed passed": skipped jobs (nothing relevant
  # changed) are fine, a failed or cancelled one is not.
  result:
    needs: [changes, upgrade, consumer, starter, backup, s3-minio, site-image, locale-switch, main]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every heavy job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
