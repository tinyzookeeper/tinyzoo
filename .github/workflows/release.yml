name: Release

# Every push to main: open or update the "Version packages" pull request from the
# changesets in .changeset/. Merging that pull request publishes the packages: tinyzoo,
# @tinyzoo/client and create-tinyzoo (one version for all three).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # tags, GitHub releases, the version pull request's branch
  pull-requests: write   # open and update the version pull request
  id-token: write        # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # With a GitHub App (variable RELEASE_APP_ID, secret RELEASE_APP_PRIVATE_KEY; CONTRIBUTING.md,
      # "Releases"), the version pull request is pushed and updated as the app, and its checks start
      # by themselves. With GITHUB_TOKEN, GitHub holds them until someone approves the run.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          # scripts/release.mjs tags the commit that set each version (git log of package.json).
          fetch-depth: 0
          # The git pushes (the version branch, the tags) go out with this token.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10, and pnpm
      # hands the publish to npm. With a trusted publisher set on npmjs.com, OIDC wins
      # over NPM_TOKEN, so the token can be deleted once a release has gone out this way.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          # When changesets are pending: bump the versions and write the changelogs.
          version: pnpm changeset version
          # When there are none: publish what npm does not have yet. `pnpm release`
          # builds @tinyzoo/client (dist) and publishes. The consumer check already passed on this
          # code: heavy.yml ran it on the main commit the version pull request was made from, and
          # the version pull request could not be merged before it did (heavy.yml, `main`).
          publish: pnpm release
          title: 'Version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }} # scripts/release.mjs: gh release create
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
