# The database for development: `docker compose up -d` (stop: `docker compose down`).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    ports:
      - "${SITE_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
